{% extends "base.html" %}
{% block title %}Error {{ code }} · CaseDesk{% endblock %}
{% block content %}<div class="error-page"><strong>{{ code }}</strong><h1>{{ message }}</h1><a class="button" href="{{ url_for('dashboard') }}">Back to dashboard</a></div>{% endblock %}
{% block auth_content %}<div class="error-page"><strong>{{ code }}</strong><h1>{{ message }}</h1><a class="button" href="{{ url_for('login') }}">Sign in</a></div>{% endblock %}
